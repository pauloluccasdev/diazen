<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0C0E12" />
    <title>Sem conexão · Diazen</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #0c0e12;
        color: #f5f6f8;
        font:
          14px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 700px;
        margin: 32px auto;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
      }
      h2 {
        font-size: 22px;
      }
      p {
        color: #a0a6b1;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 20px;
        border-radius: 14px;
        background: #ff9f24;
        color: #101114;
        text-decoration: none;
        font-weight: 650;
      }
      a:focus-visible {
        outline: 2px solid #ff9f24;
        outline-offset: 5px;
      }
      .brand {
        font-size: 28px;
        font-weight: 800;
      }
      .brand span {
        color: #ff9f24;
      }
      .summary {
        border: 1px solid #30343b;
        background: #191c22;
        border-radius: 22px;
        padding: 24px;
        margin: 24px 0;
        overflow-wrap: anywhere;
      }
      dl {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      dt {
        color: #a0a6b1;
      }
      dd {
        margin: 4px 0 0;
        font-weight: 650;
        font-size: 20px;
      }
      @media (max-width: 350px) {
        dl {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">dia<span>zen.</span></div>
      <h1>Você está sem conexão.</h1>
      <p>
        Nenhum registro pode ser criado ou alterado enquanto você estiver
        offline. Conecte-se para atualizar os dados.
      </p>
      <section class="summary" id="summary" hidden>
        <h2 id="project"></h2>
        <p id="date"></p>
        <dl id="metrics"></dl>
        <p id="updated"></p>
      </section>
      <p id="empty">Ainda não há um resumo disponível nesta aba.</p>
      <a href="/painel">Tentar novamente</a>
    </main>
    <script>
      (function () {
        try {
          var key = "diazen-dashboard",
            raw = sessionStorage.getItem(key);
          if (!raw) return;
          var data = JSON.parse(raw);
          if (
            data.version !== 1 ||
            !Number.isFinite(data.expiresAt) ||
            data.expiresAt < Date.now() ||
            data.epoch !== (localStorage.getItem("diazen-session-epoch") || "")
          ) {
            sessionStorage.removeItem(key);
            return;
          }
          if (
            typeof data.project !== "string" ||
            typeof data.date !== "string" ||
            !Array.isArray(data.items)
          )
            return;
          document.getElementById("project").textContent = data.project;
          document.getElementById("date").textContent =
            "Consulta de " + data.date;
          data.items.slice(0, 8).forEach(function (item) {
            if (
              typeof item.label !== "string" ||
              typeof item.value !== "string"
            )
              return;
            var box = document.createElement("div"),
              label = document.createElement("dt"),
              value = document.createElement("dd");
            label.textContent = item.label;
            value.textContent = item.value;
            box.append(label, value);
            document.getElementById("metrics").append(box);
          });
          document.getElementById("updated").textContent =
            "Resumo salvo em " +
            new Date(data.updatedAt).toLocaleString("pt-BR") +
            ". Apenas leitura; pode estar desatualizado.";
          document.getElementById("summary").hidden = false;
          document.getElementById("empty").hidden = true;
        } catch (e) {}
      })();
    </script>
  </body>
</html>
